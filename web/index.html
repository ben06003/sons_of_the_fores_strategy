<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>POE 流派攻略</title>
  <meta name="description" content="流亡黯道（Path of Exile）流派攻略搜尋：依職業、昇華、流派、標籤快速查找。" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="guide.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#">
        <span class="brand-mark">◆</span>
        <span>POE 流派攻略</span>
      </a>
      <span class="version-badge" id="versionBadge"></span>
    </div>
  </header>

  <main class="wrap">
    <section class="search-panel" aria-label="搜尋與篩選">
      <label class="search-box">
        <span class="sr-only">搜尋</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="搜尋職業、昇華、流派、作者…（例：聖宗、枯萎、Palsteron）" autocomplete="off" />
      </label>
      <div class="filters">
        <label>版本 <select id="fVersion"></select></label>
        <label>職業 <select id="fClass"></select></label>
        <label>昇華 <select id="fAsc"></select></label>
        <label>標籤 <select id="fTag"></select></label>
        <label>總評 <select id="fOverall"></select></label>
        <label>排序 <select id="fSort"><option value="">表格順序</option><option value="overall">評價高→低</option></select></label>
        <button type="button" id="reset" class="btn-ghost">清除</button>
      </div>
    </section>

    <p class="result-count" id="count" aria-live="polite"></p>
    <section id="list" class="grid"></section>
  </main>

  <dialog id="detail" class="detail">
    <article id="detailBody"></article>
    <button type="button" class="close" id="closeDetail" aria-label="關閉">✕</button>
  </dialog>

  <footer class="site-footer wrap" id="footer"></footer>

  <script src="data/builds.js"></script>
  <script src="data/names.js"></script>
  <script src="data/guides.js"></script>
  <script src="app.js"></script>
</body>
</html>
